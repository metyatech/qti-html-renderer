name: CI

on:
  push:
  pull_request:

# Opt the JavaScript actions (checkout, setup-node) onto the Node.js 24 runtime
# ahead of GitHub forcing it as the default on 2026-06-16. Remove this once that
# default switch lands and the deprecation annotation is gone.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run build
